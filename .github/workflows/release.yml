name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-saver-${{ matrix.os }}
          path: |
            target/release/physics-saver
            target/release/physics-saver.exe
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mkdir -p release
          mv artifacts/physics-saver-ubuntu-latest/physics-saver release/physics-saver-linux-x86_64
          mv artifacts/physics-saver-windows-latest/physics-saver.exe release/physics-saver-windows-x86_64.exe
          mv artifacts/physics-saver-macos-latest/physics-saver release/physics-saver-macos-x86_64
          chmod +x release/*
          ls -la release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
